<!DOCTYPE html>
<html lang="hu">
    <head>
        <title>[HU] FurZoneFox - Művészet</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../../global.css">
        <link rel="stylesheet" href="./művészet.css">
        <link rel="icon" type="image/x-icon" href="../../images/drawings/External/FleurFurr/FleurFurr_Soft-fox.png">
    </head>
    <body>
        <div id="page">
            <h1>Művészetek</h1>
            <p>Noha nem világhírű, ámde vannak művészeti műveim, ezek nagyrészt <strong>vers</strong>ek, avagy <strong>verses történet</strong>ek formájában találhatóak meg.<br>Míly fajtájú költészet érdekelne téged?</p>
            <hr>
            <div>
                <select name="website" id="art" onchange="var new_page = document.getElementById('art').value
                if ('back' in new_page) {
                    if ('land' in new_page) {
                        document.location.href = 'https:/' + '/furzonefox.github.io/Furzonefox/'
                    } else if ('hu' in new_page) {
                        document.location.href = 'https:/' + '/furzonefox.github.io/Furzonefox/hu'
                    }
                } else {
                    document.location.href = 'https:/' + '/furzonefox.github.io/Furzonefox/hu/művészet/' + new_page
                }">
                    <option disabled selected hidden>Válassz művészeti ágat...</option>
                    <optgroup title="Vizuális">
                        <option value="rajzok">[X] Rajzok/Festmények</option>
                    </optgroup>
                    <optgroup title="Írott">
                        <option value="versek">Versek</option>
                        <option value="verses-tortenetek">[...] Verses Történetek</option>
                    </optgroup>
                    <optgroup title="Vissza">
                        <option value="back_land">Vissza Teljesen</option>
                        <option value="back_hu">Visszalépés</option>
                    </optgroup>
                </select>
            </div>
        </div>
    </body>
</html>
