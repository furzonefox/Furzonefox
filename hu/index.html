<!DOCTYPE html>
<html lang="hu">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://furzonefox.github.io/Furzonefox/global.css">
        <link rel="stylesheet" href="hu.css">
        <link type="image/x-icon" rel="icon" href="https://furzonefox.github.io/Furzonefox/images/drawings/External/FleurFurr/FleurFurr_Soft-fox.png">
        <title>[hu] FurZoneFox</title>
    </head>
    <body>
        <div id="page">
            <figure>
                <img src="https://furzonefox.github.io/Furzonefox/images/drawings/External/FleurFurr/FleurFurr_Soft-fox.png" alt="profilkép FleurFurr-től" title="profilkép FleurFurr-től">
                <figcaption>profilkép <a href="https://www.fleurfurr.com">FleurFurr</a>-től</figcaption>
            </figure>
            <h1>Üdvözöllek!</h1>
            <p>Üdvözöllek a weboldalamon!</p>
            <p>FurZoneFox-nak hívnak és egy barátságos Kemonomimi vagyok a furry fandom-ban.</p>
            <br>
            <p>Tudj meg többet <a href="https://furzonefox.github.io/Furzonefox/hu/bemutatkozás">itt</a>.</p>
            <select name="website" id="website-select" onchange="var page = document.getElementById('website-select').value
            if (page === 'back-land') {
                document.location.href = 'https:/' + '/furzonefox.github.io/Furzonefox'
            } else {
                document.location.href = 'https:/' + '/furzonefox.github.io/Furzonefox/hu/' + page
            }">
                <option disabled hidden selected>További infó?</option>
                <optgroup label="Több tőlem">
                    <option value="bemutatkozás">Bemutatkozás</option>
                    <option value="művészet">Művészet</option>
                </optgroup>
                <optgroup label="Vissza">
                    <option value="back-land">Vissza a landoló oldalra</option>
                </optgroup>

            </select>
            <hr>
            <p class="note">Jelenleg dolgozok ezen a weboldalon. Kérlek, légy türelmes amíg én összegyüjtöm a tennivalókat és munkához látok!</p>
        </div>
    </body>
</html>
